<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>עדי</title>
  <style>
    body {
      margin: 0;
      background: #eeeeff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    .screen.show {
      display: block;
      animation: fadeIn 350ms ease-out; /* פייד ארוך יותר */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to   { opacity: 1; transform: scale(1); }
    }

    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="screen1" class="screen show">
    <img src="IMG_5012.jpeg" id="touchArea">
  </div>

  <div id="screen2" class="screen">
    <img src="IMG_5010.jpeg">
  </div>

  <script>
    const touchArea = document.getElementById('touchArea');
    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');

    function showSecret() {
      screen1.classList.remove('show');
      screen2.classList.add('show');
    }

    function hideSecret() {
      screen2.classList.remove('show');
      screen1.classList.add('show');
    }

    touchArea.addEventListener('mousedown', showSecret);
    document.addEventListener('mouseup', hideSecret);

    touchArea.addEventListener('touchstart', function (e) {
      e.preventDefault();
      showSecret();
    });

    document.addEventListener('touchend', function (e) {
      e.preventDefault();
      hideSecret();
    });

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>

</body>
</html>
