<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>משחק פשוט</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eeeeff;
      font-family: Arial, sans-serif;
    }

    .phone {
      aspect-ratio: 9 / 16;
      width: 320px;
      max-width: 90vw;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      overflow: hidden;
      position: relative;
      background: #fff;
    }

    .screen {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .screen.show {
      opacity: 1;
    }

    .img-full {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div id="screen1" class="screen show">
      <img src="IMG_5012.png" class="img-full" id="touchArea">
    </div>

    <div id="screen2" class="screen">
      <img src="IMG_5010.png" class="img-full">
    </div>
  </div>

  <script>
    const touchArea = document.getElementById('touchArea');
    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');

    function showSecret() {
      screen1.classList.remove('show');
      screen2.classList.add('show');
    }

    function hideSecret() {
      screen2.classList.remove('show');
      screen1.classList.add('show');
    }

    touchArea.addEventListener('mousedown', showSecret);
    document.addEventListener('mouseup', hideSecret);

    touchArea.addEventListener('touchstart', function (e) {
      e.preventDefault();
      showSecret();
    });

    document.addEventListener('touchend', function (e) {
      e.preventDefault();
      hideSecret();
    });
  </script>

</body>
</html>
