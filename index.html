<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>משחק פשוט</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eeeeff;
      font-family: Arial, sans-serif;
    }

    .phone {
      aspect-ratio: 9 / 16;
      width: 320px;
      max-width: 90vw;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      overflow: hidden;
      position: relative;
      background: #000; /* כדי שלא יראו שוליים */
    }

    /* מסך בסיס */
    .screen {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    /* מסך ראשון מוצג מיידית */
    #screen1.show {
      opacity: 1;
    }

    /* מסך שני עם פייד */
    #screen2 {
      transition: opacity 0.3s ease;
    }

    #screen2.show {
      opacity: 1;
    }

    /* תמונות */
    .img-full {
      width: 100%;
      height: 100%;
      object-fit: cover; /* ממלא את המסך בלי לשנות יחס */
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="phone">
    <!-- מסך 1 -->
    <div id="screen1" class="screen show">
      <img src="IMG_5012.jpeg" class="img-full" id="touchArea">
    </div>

    <!-- מסך 2 -->
    <div id="screen2" class="screen">
      <img src="IMG_5010.jpeg" class="img-full">
    </div>
  </div>

  <script>
    const touchArea = document.getElementById('touchArea');
    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');

    function showSecret() {
      screen1.classList.remove('show');
      screen2.classList.add('show');
    }

    function hideSecret() {
      screen2.classList.remove('show');
      screen1.classList.add('show'); // חזרה מיידית
    }

    /* עכבר */
    touchArea.addEventListener('mousedown', showSecret);
    document.addEventListener('mouseup', hideSecret);

    /* מסך מגע */
    touchArea.addEventListener('touchstart', function (e) {
      e.preventDefault();
      showSecret();
    });

    document.addEventListener('touchend', function (e) {
      e.preventDefault();
      hideSecret();
    });

    /* מניעת תפריט לחיצה ארוכה */
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>

</body>
</html>
